<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Glowmoth</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:'Gm Display';src:url(assets/fonts/display.woff2) format('woff2');font-display:block}
:root{--ink:#140c24;--amber:#ffb347;--glow:#ffd98a;--teal:#4fd6c9;--violet:#7a5cff;--panel:#1d1436e6;--text:#fff4e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#07040f;color:var(--text);font-family:'Gm Display',Georgia,serif;color-scheme:dark}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#07040f}
#game{position:relative;width:100vw;height:56.25vw;max-height:100dvh;max-width:177.78dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,#2a1640,#07040f 70%);z-index:50;transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}
.loading .orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff3c4,#ffb347 45%,#ff7a1a00 70%);box-shadow:0 0 40px 12px #ffb34766;animation:breathe 1.6s ease-in-out infinite}
.loading p{margin:18px 0 0;text-align:center;letter-spacing:.3em;font-size:13px;opacity:.75}
.loading .err{color:#ffb4ab;font:14px system-ui,sans-serif;max-width:340px;text-align:center;letter-spacing:0}
@keyframes breathe{50%{transform:scale(1.15);box-shadow:0 0 60px 20px #ffb34788}}
.rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:#07040fee;z-index:60;font-size:18px;letter-spacing:.08em;padding:24px}
@media (orientation:portrait) and (max-width:820px){.rotate{display:grid}}
@media (prefers-reduced-motion:reduce){.loading .orb{animation:none}}
</style>
</head>
<body>
<div id="stage"><div id="game">
  <canvas id="view" aria-label="Glowmoth game view"></canvas>
  <div id="ui"></div>
  <div class="loading" id="loading"><div><div class="orb" style="margin:auto"></div><p>GATHERING LIGHT</p><p class="err" id="loadErr"></p></div></div>
</div></div>
<div class="rotate" id="rotate"><div>Turn your device sideways<br><small style="opacity:.7">Glowmoth plays in landscape</small></div></div>

<!-- libraries: three.js r128 + post-processing, matter.js 0.19 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<!-- game modules (design/design.md section 7) -->
<script src="js/engine.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script>
"use strict";
(async function boot() {
  const err = m => { document.getElementById("loadErr").textContent = m; };
  try {
    if (!window.THREE || !window.Matter) throw new Error("Could not load the game libraries. Check your connection and reload.");
    await Game.init({ canvas: document.getElementById("view"), root: document.getElementById("game"), ui: document.getElementById("ui") });
    window.FX && FX.setup && FX.setup(Game);
    window.UI && UI.setup && UI.setup(Game);
    document.getElementById("loading").classList.add("done");
  } catch (e) { console.error(e); err(e.message || String(e)); }
})();
</script>
</body>
</html>
