@font-face{font-family:'Nunito';src:url(assets/fonts/nunito-800.woff2) format('woff2');font-weight:800;font-display:block}

<style>
:root{--navy:#14213d;--ink:#0d1630;--blue:#2f7bff;--blue-d:#1a4fc4;--red:#e8392f;--yellow:#ffc928;--gold:#ffb300;--green:#38c95b;--card:#fff;--muted:#6b7591;--panel:#1b2a52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#0b1328;color-scheme:dark;font-family:Nunito,system-ui,sans-serif;color:#fff}
#game{position:relative;width:min(100vw,calc(100dvh*0.5625));height:100%;margin:0 auto;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#f4c9a0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.font{font-family:'Lilita One',Nunito,sans-serif;letter-spacing:.5px}
.stroke{text-shadow:0 2px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 4px 0 var(--ink)}
button{font-family:'Lilita One',sans-serif;cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
/* HUD */
.hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;z-index:4;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;min-width:84px;height:30px;padding:0 10px 0 4px;border-radius:16px;background:linear-gradient(#3d8bff,#1f5fd6);border:2px solid #0f3a8f;box-shadow:0 3px 0 #0f3a8f;font:18px 'Lilita One',sans-serif}
.chip img{width:26px;height:26px;object-fit:contain;margin-left:-2px}
.chip span{flex:1;text-align:right}
.round{width:44px;height:44px;border-radius:12px;background:linear-gradient(#4b97ff,#2160d8);border:2px solid #0f3a8f;box-shadow:0 3px 0 #0f3a8f;display:grid;place-items:center;color:#fff;font-size:22px}
.round svg{width:24px;height:24px}
.levelpill{position:absolute;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top));display:grid;justify-items:center;gap:2px;pointer-events:none}
.levelpill .name{display:flex;align-items:center;gap:6px;padding:4px 14px;border-radius:16px;background:linear-gradient(#5ab0ff,#2f7bff);border:2px solid #0f3a8f;font:15px 'Lilita One',sans-serif;white-space:nowrap}
.levelpill .lv{font:11px 'Lilita One',sans-serif;background:#0f3a8f;padding:1px 10px;border-radius:8px;margin-top:-6px}
.progress{width:min(52vw,230px);height:18px;border-radius:9px;background:#22305a;border:2px solid #0d1630;position:relative;overflow:hidden}
.progress i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#7cf08f,#2bb64c);border-radius:7px}
.progress b{position:absolute;inset:0;display:grid;place-items:center;font:12px 'Lilita One',sans-serif}
.progress .flag{position:absolute;right:2px;top:1px;width:12px;height:12px;background:conic-gradient(#fff 0 25%,#111 0 50%,#fff 0 75%,#111 0);background-size:6px 6px;border-radius:2px}
.count{position:absolute;z-index:3;transform:translate(-50%,-100%);pointer-events:none;display:flex;align-items:center;gap:4px;padding:2px 10px 2px 4px;border-radius:14px;background:#1f5fd6;border:2px solid #0d1630;font:18px 'Lilita One',sans-serif;box-shadow:0 3px 0 #0d1630}
.count img{width:22px;height:22px}
.bossbar{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 64px);transform:translateX(-50%);width:min(70vw,300px);z-index:4;text-align:center}
.bossbar .bar{height:18px;border-radius:9px;background:#3b0f12;border:3px solid #0d1630;overflow:hidden;box-shadow:0 3px 0 #0d1630}
.bossbar .bar i{display:block;height:100%;width:100%;background:linear-gradient(#ff8a6a,#e0352a 55%,#b81c14);box-shadow:inset 0 3px 0 #ffffff55;transition:width .15s}
.bossbar .label{font:16px 'Lilita One',sans-serif;margin-bottom:3px;display:flex;align-items:center;justify-content:center;gap:6px}
.bossbar .label svg{width:20px;height:20px;flex:none}
.floats{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font:22px 'Lilita One',sans-serif;white-space:nowrap;animation:rise .9s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translate(-50%,-50%) scale(.7)}25%{transform:translate(-50%,-90%) scale(1.15)}to{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.weapon-tag{position:absolute;left:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:4;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:12px;background:#0d1630cc;font:14px 'Lilita One',sans-serif}
.weapon-tag img{height:22px}
/* Home */
.home{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.home>*{pointer-events:auto}
.logo{margin:calc(max(10px,env(safe-area-inset-top)) + 58px) auto 0;text-align:center;line-height:.9;transform:rotate(-4deg)}
.logo img{display:block;width:80%;max-width:340px;margin:0 auto;filter:drop-shadow(0 8px 12px #0d163066)}
.logo.has-img{transform:none}.logo.has-img b{display:none}
.logo b{display:block;font:clamp(44px,15vw,72px) 'Lilita One',sans-serif;color:#fff;background:linear-gradient(#fff 30%,#bfe3ff 60%,#5fb4ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #0d1630) drop-shadow(0 -2px 0 #0d1630) drop-shadow(2px 0 0 #0d1630) drop-shadow(-2px 0 0 #0d1630)}
.hint{align-self:center;display:grid;justify-items:center;gap:6px;pointer-events:none}
.hint .pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:8px;background:#0d1630cc;font:15px 'Lilita One',sans-serif}
.hint .arrows{display:flex;gap:4px}.hint .arrows i{width:20px;height:20px;border-radius:4px;background:#fff;color:#0d1630;display:grid;place-items:center;font-style:normal;font-size:13px}
.hint .line{width:170px;height:2px;background:#fff;position:relative}.hint .line:before,.hint .line:after{content:'';position:absolute;top:-4px;border:5px solid transparent}.hint .line:before{left:-6px;border-right-color:#fff}.hint .line:after{right:-6px;border-left-color:#fff}
.hand{width:34px;height:34px;animation:swipe 1.4s ease-in-out infinite;margin-top:-4px}
@keyframes swipe{0%,100%{transform:translateX(-70px)}50%{transform:translateX(70px)}}
.btn.playbtn{width:min(62%,250px);margin:14px auto calc(max(150px,20vh) + env(safe-area-inset-bottom));font-size:32px;padding:10px 0 14px;animation:pulse 1.2s ease-in-out infinite} /* sits above the squad */
@keyframes pulse{50%{transform:scale(1.08)}}
/* Modals */
.modal{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:20px;background:#0b1328b0}
.panel{width:100%;max-width:340px;border-radius:22px;background:linear-gradient(#2b4a9a,#1b2a52);border:3px solid #0d1630;box-shadow:0 6px 0 #0d1630,0 20px 50px #0008;padding:18px 18px 20px;text-align:center}
.panel h2{margin:0 0 4px;font:34px/1 'Lilita One',sans-serif}
.panel .sub{color:#bcd0ff;font-weight:800;margin:6px 0 12px}
.stars{display:flex;justify-content:center;gap:4px;margin:6px 0 4px}
.stars svg{width:54px;height:54px}.stars svg:nth-child(2){transform:translateY(-10px);width:64px;height:64px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-size:22px;color:#fff;margin-top:10px;min-height:52px}
.btn.go{background:linear-gradient(#5be07a,#2bb64c);box-shadow:0 5px 0 #157a2f;border:2px solid #0d1630}
.btn.alt{background:linear-gradient(#5ab0ff,#2f7bff);box-shadow:0 5px 0 #0f3a8f;border:2px solid #0d1630}
.btn:active{transform:translateY(3px)}
.bigpct{font:54px/1 'Lilita One',sans-serif;color:#ffd84a}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font:18px 'Lilita One',sans-serif;border-bottom:1px solid #ffffff22}
.toggle button{min-width:84px;min-height:40px;border-radius:12px;background:#0d1630;color:#fff;font-size:16px}
.toggle button[aria-pressed=true]{background:#2bb64c}
.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#0b1328;font:22px 'Lilita One',sans-serif}
.loading>div{display:grid;justify-items:center;gap:14px}
.loading .loadlogo{width:min(72%,300px)}
.loading .loadbar{width:min(56%,220px);height:12px;border-radius:6px;background:#22305a;border:2px solid #0d1630;overflow:hidden}
.loading .loadbar i{display:block;height:100%;width:40%;border-radius:6px;background:linear-gradient(#7cf08f,#2bb64c);animation:loadslide 1.1s ease-in-out infinite}
@keyframes loadslide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.loading .loadtxt{font-size:16px;opacity:.8}
.loading .err{max-width:280px;text-align:center;color:#ffb4ab;font:15px Nunito,sans-serif;font-weight:800}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:min(56vh,420px);overflow:auto;padding:4px 2px 8px;margin:8px 0 4px}
.lvtile{min-height:76px;border-radius:12px;background:linear-gradient(#5ab0ff,#2f7bff);border:2px solid #0d1630;box-shadow:0 3px 0 #0d1630;color:#fff;display:grid;justify-items:center;align-content:center;gap:2px;padding:6px 4px}
.lvtile b{font:24px/1 'Lilita One',sans-serif}.lvtile small{font:10px/1.1 'Lilita One',sans-serif;opacity:.9;text-align:center}
.lvtile .st{display:flex;gap:1px}.lvtile .st svg{width:14px;height:14px}
.lvtile.cur{background:linear-gradient(#5be07a,#2bb64c)}
.lvtile:disabled{background:#2a3760;color:#8090b8;box-shadow:none;cursor:default}
.flash{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(transparent 50%,#ff1e1e88);opacity:0;transition:opacity .25s}
@media (prefers-reduced-motion:reduce){.hand,.playbtn,.loading .loadbar i{animation:none}.float{animation-duration:.01s}}
</style>

    <button class="round" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="#fff"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4L10.7 6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";
// ---------- persistence ----------
const SAVE_KEY = "squad-surge-v1";
const save = (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { console.warn("save unreadable", e); return {}; } })();
Object.assign(save, { level: 1, unlocked: 1, best: {}, stars: {}, bestSquad: {}, sound: true, vibe: true, ...save });
save.unlocked = Math.max(save.unlocked, save.level);
for (const k of ["coins", "gems", "up"]) delete save[k]; // drop old shop data from earlier builds
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { console.warn("save failed", e); } }

// ---------- constants ----------
const ROAD = 6;               // road half-width
const SPEED = 8.5;            // squad forward speed (units/s)
const BULLET_SPEED = 72, BULLET_RANGE = 46;
const MAX_SHOOTERS = 48;
const START_SQUAD = 5;
const WEAPONS = [
  { name: "PISTOL", img: "assets/w-pistol.png", dmg: 1, rate: 1, spread: 1 },
  { name: "RIFLE", img: "assets/w-rifle.png", dmg: 1.4, rate: 1.35, spread: 1 },
  { name: "SHOTGUN", img: "assets/w-shotgun.png", dmg: 1.2, rate: 1, spread: 3 },
  { name: "MINIGUN", img: "assets/w-minigun.png", dmg: 1.3, rate: 2.4, spread: 1 },
  { name: "BAZOOKA", img: "assets/w-bazooka.png", dmg: 7, rate: 0.4, spread: 1, splash: 2.6 },
];
const THEMES = [
  { id: "town", name: "OLD TOWN", sky: ["#f9c48f", "#fde8c9"], fog: 0xf6d2aa, ground: "t-dirt", road: "t-asphalt", side: "t-cobble", enemy: "zombie", deco: "city", landmark: "tower" },
  { id: "bridge", name: "GOLDEN BRIDGE", sky: ["#6fb6ff", "#d8eeff"], fog: 0xbfe0ff, ground: null, water: 0x2f8fd0, road: "t-asphalt", side: "t-concrete", enemy: "grunt", deco: "bridge" },
  { id: "pier", name: "OLD PIER", sky: ["#7fd3e6", "#e9fbff"], fog: 0xc6eef5, ground: null, water: 0x1d9fb8, road: "t-concrete", side: "t-cobble", enemy: "zombie", deco: "pier" },
  { id: "ruins", name: "RUINED CITY", sky: ["#9aa7b8", "#e7d6c2"], fog: 0xcfc6bb, ground: "t-dirt", road: "t-asphalt", side: "t-cobble", enemy: "grunt", deco: "city" },
  { id: "desert", name: "DESERT HIGHWAY", sky: ["#ffb36b", "#ffe9b8"], fog: 0xf5d6a0, ground: "t-dirt", road: "t-asphalt", side: "t-dirt", enemy: "zombie", deco: "desert" },
  { id: "arena", name: "WAR ARENA", sky: ["#24345f", "#5a6d9a"], fog: 0x3b4c78, ground: null, water: 0x1a2546, road: "t-concrete", side: "t-concrete", enemy: "grunt", deco: "arena" },
];

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const gameEl = $("game"), canvas = $("view");
{ // title logo image, with the text logo as fallback
  const img = $("logoImg");
  img.onload = () => { img.hidden = false; $("logo").classList.add("has-img"); };
  img.onerror = () => img.remove();
  if (img.complete && img.naturalWidth) img.onload();
}

// ---------- three setup ----------
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const BASE_FOV = 60;
const CAM = { h: 9.5, back: 10, ahead: 20 }; // chase camera: height, distance behind the squad, aim point ahead of it
const camera = new THREE.PerspectiveCamera(BASE_FOV, 9 / 16, 0.5, 400);
const loader = new THREE.TextureLoader();
const TEX = {};
function loadTex(name, file) {
  return new Promise((res, rej) => loader.load(file, t => { t.anisotropy = 4; TEX[name] = t; res(t); }, undefined, () => rej(new Error(`Could not load ${file}`))));
}
function resize() {
  const w = gameEl.clientWidth, h = gameEl.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

// ---------- instanced sprite layers ----------
const SPRITE_VS = `
#include <fog_pars_vertex>
attribute vec3 aOff; attribute vec2 aScale; attribute vec3 aFrame;
uniform vec2 grid; varying vec2 vUv; varying float vA; varying float vFlash;
void main(){
  vec4 mvPosition = modelViewMatrix * vec4(aOff, 1.0);
  mvPosition.xy += position.xy * aScale;
  gl_Position = projectionMatrix * mvPosition;
  float f = aFrame.x; float c = mod(f, grid.x); float r = floor(f / grid.x + 0.001);
  vUv = vec2((c + uv.x) / grid.x, 1.0 - (r + 1.0 - uv.y) / grid.y);
  vA = aFrame.y; vFlash = aFrame.z;
  #include <fog_vertex>
}`;
const SPRITE_FS = `
#include <fog_pars_fragment>
uniform sampler2D map; uniform vec3 tint; varying vec2 vUv; varying float vA; varying float vFlash;
void main(){

    const after = h.op === "x" ? Math.round(before * h.v) : before + h.v;
    if (after > before) { addSoldiers(after - before); sfx("gate"); floatText(L.sx, 2, L.sz, h.op === "x" ? `x${h.v}` : `+${after - before}`, "#7fd0ff"); }
    else if (after < before) { killSoldiers(before - after); sfx("bad"); vibe(60); flashRed(); floatText(L.sx, 2, L.sz, `${after - before}`, "#ff6a5a"); }

    bus.emit("gatePass", { gate: g, half: h, before, after });
  }
  // squad runs into unbroken solids: soldiers in that column die, object breaks
  for (const o of L.solids) {
    if (!o.alive || !(prevZ > o.z + 0.4 && L.sz <= o.z + 0.4)) continue;
    const hit = L.soldiers.filter(s => Math.abs(s.x - o.x) < o.hw + 0.2).length;
    if (!hit) continue;
    const lose = Math.min(hit, Math.ceil(o.hp / 10) + 1);
    killSoldiers(lose, o.x); breakSolid(o, false); vibe(50); flashRed(); floatText(o.x, 2, o.z, `-${lose}`, "#ff6a5a");
  }
  // shooting (gates/solids above may have changed the count)
  const nNow = L.soldiers.length;
  if (nNow > 0) {
    const n = nNow;
    const shooters = Math.min(n, MAX_SHOOTERS), per = n / shooters, wp = WEAPONS[L.weapon];
    L.fireAcc += dt * shooters * fireRate();
    while (L.fireAcc >= 1) {
      L.fireAcc -= 1;
      const s = L.soldiers[Math.floor(Math.random() * n)];
      for (let k = 0; k < wp.spread; k++) {
        const vx = wp.spread > 1 ? (k - 1) * 4 : 0;
        L.bullets.push({ x: s.x + 0.12, z: s.z - 0.4, vx, life: BULLET_RANGE / BULLET_SPEED, dmg: damage() * per, splash: wp.splash || 0 });
      }
      if (Math.random() < 0.15) L.fx.push({ x: s.x + 0.12, y: 1.15, z: s.z - 0.5, f: 1, t: 0, dur: 0.08, size: 0.7 });
    }
    L.shotSfx -= dt; if (L.shotSfx <= 0) { sfx(wp.splash ? "rocket" : "shot"); L.shotSfx = wp.splash ? 0.2 : 0.11; }
  }
  // bullets
  const active = L.enemies.filter(e => e.state !== "dead" && e.state !== "dying" && e.z > L.sz - BULLET_RANGE - 4 && e.z < L.sz + 6);
  const solidsNear = L.solids.filter(o => o.alive && o.z > L.sz - BULLET_RANGE - 4 && o.z < L.sz + 2);
  const gatesNear = L.gates.filter(g => !g.used && g.z > L.sz - BULLET_RANGE - 4 && g.z < L.sz);
  const b0 = L.boss;
  for (let i = L.bullets.length - 1; i >= 0; i--) {
    const b = L.bullets[i], oz = b.z;
    b.z -= BULLET_SPEED * dt; b.x += b.vx * dt; b.life -= dt;
    let hit = false;
    for (const o of solidsNear) {
      if (o.alive && Math.abs(b.x - o.x) < o.hw && oz >= o.z && b.z <= o.z) { hitSolid(o, b.dmg); if (b.splash) explode(b.x, o.z, b.dmg, b.splash); hit = true; break; }
    }
    if (!hit) for (const g of gatesNear) {
      if (oz >= g.z && b.z <= g.z) {
        const h = g.halves.find(h => Math.abs(b.x - h.x) < h.hw);
        if (h && h.op === "+") { h.acc = (h.acc || 0) + b.dmg * 0.35; if (h.acc >= 1) { const inc = Math.floor(h.acc); h.acc -= inc; h.v = Math.min(h.v + inc, 99); refreshGate(g); bus.emit("gateShot", { gate: g, half: h }); } }
        else if (h && h.op === "x") { h.acc = (h.acc || 0) + b.dmg * 0.02; if (h.acc >= 1 && h.v < 3) { h.acc = 0; h.v++; refreshGate(g); bus.emit("gateShot", { gate: g, half: h }); } }
        hit = true; break;
      }
    }
    if (!hit) for (const e of active) {
      if (e.hp > 0 && Math.abs(b.x - e.x) < e.r + 0.08 && oz >= e.z - 0.3 && b.z <= e.z + 0.3) { hitEnemy(e, b.dmg); if (b.splash) explode(e.x, e.z, b.dmg, b.splash, e); hit = true; break; }
    }
    if (!hit && state === "boss" && b0.hp > 0 && Math.abs(b.x - b0.x) < 2.6 && b.z <= b0.z + 0.5) {
      b0.hp -= b.dmg * (b.splash ? 1.2 : 1); b0.flash = 0.08; hit = true;
      if (b.splash) L.fx.push({ x: b.x, y: 1.5 + Math.random() * 3, z: b0.z + 1, f: 9, t: 0, dur: 0.4, size: 2.6 });
      else if (Math.random() < 0.3) L.fx.push({ x: b.x, y: 2 + Math.random() * 3, z: b0.z + 1, f: 4, t: 0, dur: 0.2, size: 1.3 });
      if (b0.hp <= 0) bossDown();
    }
    if (hit || b.life <= 0) L.bullets.splice(i, 1);
  }
  // enemies
  L.boomSfx -= dt;
  const R = squadRadius(L.soldiers.length);
  for (const e of L.enemies) {
    if (e.state === "dead") continue;
    e.t += dt; e.flash = Math.max(0, e.flash - dt);
    if (e.state === "dying") { e.dieT += dt; if (e.dieT > 0.9) e.state = "dead"; continue; }
    if (e.state === "idle" && e.z > L.sz - 48) e.state = "walk";
    if (e.state !== "walk") continue;
    e.z += e.sp * dt;
    const dx = L.sx - e.x; e.x += Math.sign(dx) * Math.min(Math.abs(dx), dt * e.sp * 0.35);
    // separation
    if (L.soldiers.length && Math.hypot(e.x - L.sx, (e.z - L.sz) * 1.2) < R + e.r) {
      killSoldiers(e.dmg, e.x); e.hp = 0; e.state = "dying"; e.dieT = 0.3;
      L.fx.push({ x: e.x, y: 0.8, z: e.z, f: 5, t: 0, dur: 0.3, size: 1.4 }); vibe(20);
      if (e.type === "brute") { flashRed(); L.shake = 0.3; floatText(e.x, 2.5, e.z, `-${e.dmg}`, "#ff6a5a"); }
    }
    if (e.z > L.sz + 12) e.state = "dead";
  }
  // boss
  if (state === "boss" && b0.hp > 0) {
    b0.t += dt; b0.flash = Math.max(0, b0.flash - dt);
    b0.z += 1.1 * dt;
    if (b0.slamT < SLAM_WARN) b0.x += (L.sx - b0.x) * dt * 0.4; // the boss stops aiming once the warning ring shows: dodge sideways
    const prevSlam = b0.slamT; b0.slamT += dt;
    if (prevSlam < SLAM_WARN && b0.slamT >= SLAM_WARN) bus.emit("bossWarn", { boss: b0 });
    if (b0.slamT > SLAM_AT) {
      b0.slamT = 0; L.shake = 0.4; sfx("boom"); vibe(120);
      const [cx, cz] = slamCenter(b0), cap = 2 + L.level;
      let k = 0;
      for (let i = L.soldiers.length - 1; i >= 0 && k < cap; i--) {
        const sd = L.soldiers[i];
        if (Math.hypot(sd.x - cx, sd.z - cz) < SLAM_R) { L.fx.push({ x: sd.x, y: 0.6, z: sd.z, f: 4, t: 0, dur: 0.35, size: 1.1 }); L.soldiers.splice(i, 1); k++; }
      }
      if (k) bus.emit("soldiersLost", { n: k, total: L.soldiers.length });
      bus.emit("bossSlam", { boss: b0, killed: k });
      if (k) { flashRed(); floatText(L.sx, 2.5, L.sz, `-${k}`, "#ff6a5a"); } else if (L.sz - b0.z < 14) floatText(L.sx, 2.5, L.sz, "DODGED!", "#7fd0ff");
      L.fx.push({ x: cx, y: 0.3, z: cz, f: 9, t: 0, dur: 0.5, size: SLAM_R * 1.6 });
    }
    if (b0.z + 2.6 > L.sz - R) killSoldiers(L.soldiers.length);
    $("bossFill").style.width = `${Math.max(0, b0.hp / b0.maxHp) * 100}%`;
  }
  if (L.winT > 0) { L.winT -= dt; if (L.winT <= 0) win(); }
  // fx
  for (let i = L.fx.length - 1; i >= 0; i--) { const f = L.fx[i]; f.t += dt; if (f.t >= f.dur) L.fx.splice(i, 1); }
  L.shake = Math.max(0, L.shake - dt);
  // progress & end
  const prog = Math.min(1, -L.sz / L.length); L.reached = Math.max(L.reached, prog);
  $("progFill").style.width = `${prog * 100}%`; $("progPct").textContent = `${Math.floor(prog * 100)}%`;
  $("countN").textContent = L.soldiers.length;
  if (L.soldiers.length === 0 && (state === "play" || state === "boss")) lose();
}
function hitSolid(o, dmg) {
  o.hp -= dmg; Obj3D.solidHit(o); bus.emit("solidHit", { o });
  if (Math.random() < 0.25) L.fx.push({ x: o.x + (Math.random() - 0.5) * o.hw, y: 1 + Math.random(), z: o.z + 0.3, f: 4, t: 0, dur: 0.15, size: 0.8 });
  if (o.hp <= 0) breakSolid(o, true); else labelSolid(o);
}
function breakSolid(o, earned) {
  o.alive = false; Obj3D.solidBreak(o); bus.emit("solidBreak", { o, earned });
  L.fx.push({ x: o.x, y: 1, z: o.z, f: 9, t: 0, dur: 0.45, size: 3 });
  if (!earned) return;
  sfx("hit");
  if (o.reward) { addSoldiers(o.reward); floatText(o.x, 2.2, o.z, `+${o.reward}`, "#7fd0ff"); L.fx.push({ x: o.x, y: 1.4, z: o.z, f: 14, t: 0, dur: 0.4, size: 1.8 }); }
  if (o.ammo) { L.rateMult = Math.min(2.2, L.rateMult * 1.35); weaponLabel(); bus.emit("rateUp", { mult: L.rateMult }); floatText(o.x, 2.6, o.z, "FIRE RATE UP!", "#9dff7a"); sfx("gate"); vibe(40); }
  if (o.weapon) { if (o.weapon > L.weapon) setWeapon(o.weapon); floatText(o.x, 2.6, o.z, WEAPONS[L.weapon].name + "!", "#ffe066"); sfx("win"); vibe(60); }
}
function hitEnemy(e, dmg) {
  e.hp -= dmg; e.flash = 0.07; bus.emit("enemyHit", { e });
  if (e.hp <= 0) {
    e.state = "dying"; e.dieT = 0; bus.emit("enemyDie", { e });
    if (e.type === "brute") { L.fx.push({ x: e.x, y: 0.5, z: e.z, f: 9, t: 0, dur: 0.45, size: 3 }); L.shake = 0.2; sfx("boom"); }
    else if (Math.random() < 0.3) L.fx.push({ x: e.x, y: 0.9, z: e.z, f: 6, t: 0, dur: 0.3, size: 1 });
  }
}
function bossDown() {
  L.boss.state = "down"; L.shake = 0.6; sfx("boom"); vibe(200);
  for (let k = 0; k < 6; k++) L.fx.push({ x: L.boss.x + (Math.random() - 0.5) * 4, y: Math.random() * 4, z: L.boss.z + 1, f: 9, t: -k * 0.08, dur: 0.6, size: 4 });
  L.winT = 1.2; // counted in step() so pausing can't swallow the win
  bus.emit("bossDown", { boss: L.boss });
}
let flashTimer = 0;
function flashRed() { const f = $("flash"); f.style.opacity = 1; clearTimeout(flashTimer); flashTimer = setTimeout(() => f.style.opacity = 0, 140); }
const STAR_PATH = "M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z";
function starIcons(n) { return [0, 1, 2].map(i => `<svg viewBox="0 0 24 24"><path d="${STAR_PATH}" fill="${i < n ? "#ffd84a" : "#3a4a78"}" stroke="#0d1630" stroke-width="1.5"/></svg>`).join(""); }
function renderLevels() {
  const grid = $("lvgrid"); grid.innerHTML = "";
  const last = Math.max(12, Math.ceil((save.unlocked + 1) / 3) * 3);
  for (let n = 1; n <= last; n++) {
    const b = document.createElement("button"), open = n <= save.unlocked;
    b.className = "lvtile" + (n === save.level ? " cur" : ""); b.disabled = !open;
    b.innerHTML = open ? `<b class="stroke">${n}</b><small>${levelName(n)}</small><span class="st">${starIcons(save.stars[n] || 0)}</span>` : `<b>🔒</b><small>${n}</small>`;

    b.onclick = () => { save.level = n; persist(); goLevel(n, "home"); };
    grid.appendChild(b);
  }
  grid.querySelector(".cur")?.scrollIntoView({ block: "nearest" });
}
function win() {
  if (state !== "boss") return;
  const n = L.soldiers.length, stars = n >= 30 + L.level * 10 ? 3 : n >= 10 + L.level * 3 ? 2 : 1;
  const newBest = n > (save.bestSquad[L.level] || 0);
  save.best[L.level] = 1; save.stars[L.level] = Math.max(save.stars[L.level] || 0, stars);
  if (newBest) save.bestSquad[L.level] = n;
  save.level = L.level + 1; save.unlocked = Math.max(save.unlocked, save.level); persist();
  $("stars").innerHTML = starIcons(stars);
  $("winSub").textContent = `${n} soldiers survived · ${levelName(L.level)}${newBest ? " · NEW BEST!" : ""}`;
  sfx("win"); setState("win");
  bus.emit("win", { stars, n, level: L.level, newBest });
  Scenery.preload(themeFor(L.level + 1)).catch(() => {}); // fetch the next theme while the player looks at the stars
}
function explode(x, z, dmg, radius, skip = null) {
  L.fx.push({ x, y: 0.6, z, f: 9, t: 0, dur: 0.4, size: radius * 1.3 });
  if (L.boomSfx <= 0) { sfx("boom"); L.boomSfx = 0.18; }
  for (const e of L.enemies) {

  }
}
function lose() {
  const pct = Math.floor(L.reached * 100);
  const prev = save.best[L.level] || 0; save.best[L.level] = Math.max(prev, L.reached); persist();
  $("losePct").textContent = state === "boss" ? "BOSS" : `${pct}%`;
  $("loseBest").textContent = prev && prev < 1 ? `Best: ${Math.floor(prev * 100)}%` : "";
  const atBoss = state === "boss";
  sfx("bad"); vibe(200); setState("lose");
  bus.emit("lose", { pct, atBoss });
}

// ---------- render ----------
function popScale(t) { const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); } // ease-out-back 0..1
function render(dt) {
  const n = L.soldiers.length, R = squadRadius(n);
  const shake = L.shake > 0 && !matchMedia("(prefers-reduced-motion: reduce)").matches ? (Math.random() - 0.5) * L.shake * 0.8 : 0;
  const camH = CAM.h + Math.min(6, R * 1.2), camBack = CAM.back + Math.min(6, R);
  camera.position.set(L.sx * 0.45 + shake, camH, L.sz + camBack);
  lookAt.set(L.sx * 0.45, 0, L.sz - CAM.ahead); camera.lookAt(lookAt);
  camera.fov = BASE_FOV;
  bus.emit("frame", { dt, camera, look: lookAt, L, state }); // Juice may move the camera (then re-aim it at `look`) and change the fov
  camera.updateProjectionMatrix();
  const { sold, enem, brute, boss, fx, shadow } = layers;
  sold.begin(); enem.begin(); brute.begin(); boss.begin(); fx.begin(); shadow.begin();
  const firing = state === "play" || state === "boss";
  for (const s of L.soldiers) {
    s.ph += dt * 11; const f = Math.floor(s.ph) % 4 + (firing ? 4 : 0);
    const age = s.born === undefined ? 1 : (L.time - s.born) / 0.25, k = age >= 1 ? 1 : popScale(Math.max(0, age));
    sold.push(s.x, 0, s.z, SOLDIER_H * 0.512 * k, SOLDIER_H * k, f); shadow.push(s.x + SHADOW_DX, s.z + SHADOW_DZ, 1.0 * k);
  }
  const eTex = L.theme.enemy;
  for (const e of L.enemies) {
    if (e.state === "dead" || e.z < L.sz - 120) continue;
    let f, a = 1;
    if (e.state === "dying") { f = 4 + Math.min(3, Math.floor(e.dieT / 0.15)); a = e.dieT > 0.6 ? 1 - (e.dieT - 0.6) / 0.3 : 1; }
    else f = e.state === "walk" ? Math.floor(e.t * 8) % 4 : 0;
    const layer = e.type === "brute" ? brute : enem;
    layer.push(e.x, 0, e.z, e.h * CHAR_K * ENEMY_ASPECT[e.type === "brute" ? "brute" : eTex], e.h * CHAR_K, f, a, e.flash > 0 ? 0.7 : 0);
    if (e.state !== "dying") shadow.push(e.x + SHADOW_DX, e.z + SHADOW_DZ, e.r * 2.5);
  }
  const b = L.boss;
  if (b.hp > 0 || b.state === "down") {
    let f = b.state === "down" ? 5 : b.slamT > 2.2 ? 4 : b.slamT > 1.8 ? 3 : Math.floor(b.t * 4) % 3;
    if (b.state === "wait") f = 3;
    // boss flickers when hit instead of washing out white under heavy fire
    boss.push(b.x, 0, b.z, BOSS_H, BOSS_H, f, 1, b.flash > 0 && Math.floor(L.time * 14) % 3 === 0 ? 0.4 : 0); shadow.push(b.x + SHADOW_DX * 3, b.z + SHADOW_DZ * 3, 8);
  }
  for (const bl of L.bullets) bl.splash ? fx.push(bl.x, 0.85, bl.z, 0.6, 2.4, 12, 1) : fx.push(bl.x, 1.0, bl.z, 0.3, 1.6, 12, 1);

    const p = f.t / f.dur, base = f.f, frame = base === 9 ? 8 + Math.min(3, Math.floor(p * 4)) : base === 4 ? 4 + Math.min(3, Math.floor(p * 4)) : base === 1 ? 1 : base;

    slamRing.material.opacity = 0.55 + 0.45 * Math.abs(Math.sin(L.time * 14)); slamFill.scale.setScalar(Math.max(0.05, p));

  if (!$("count").hidden) {

    const c = $("count"); c.style.left = `${(tmpV.x * 0.5 + 0.5) * 100}%`; c.style.top = `${(-tmpV.y * 0.5 + 0.5) * 100}%`;
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (L) {
    if (state === "play" || state === "boss") step(dt);
    else if (state === "home") L.time += dt;
    render(state === "paused" ? 0 : dt);
  }
  requestAnimationFrame(frame);
}

// ---------- boot ----------
(async function boot() {
  try {
    await Promise.all([
      loadTex("soldier", "assets/soldier.webp"), loadTex("zombie", "assets/zombie.webp"), loadTex("grunt", "assets/grunt.webp"),
      loadTex("brute", "assets/brute.webp"), loadTex("boss", "assets/boss.webp"), loadTex("fx", "assets/fx.jpg"),
      document.fonts ? document.fonts.load("40px 'Lilita One'").catch(() => null) : null,
    ]);

  }

    shadow: new ShadowLayer(1500),
    sold: new SpriteLayer(TEX.soldier, 4, 2, 700),
    enem: null, brute: new SpriteLayer(TEX.brute, 4, 2, 80),
    boss: new SpriteLayer(TEX.boss, 3, 2, 1),
    fx: new SpriteLayer(TEX.fx, 4, 4, 1400, { additive: true }),

  requestAnimationFrame(frame);
})();
// test hooks (read by the headless playtest bot)
window.__game = { get L() { return L; }, get state() { return state; }, setState, startLevel, goLevel, save, bus, ctx, cam: CAM };
</script>
