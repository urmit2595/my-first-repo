<!doctype html>
<html lang="en">
<head><base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120d24">
<title>Spirelight</title>
<link rel="icon" href="data:,">
<style>
@font-face{font-family:'Sl Display';src:url(assets/fonts/display.woff2) format('woff2');font-display:block}
:root{--ink:#120d24;--amber:#ffb35a;--glow:#ffd98a;--teal:#4fd6c9;--brass:#c8963e;--paver:#efe2c6;--text:#fff4e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0818;color:var(--text);font-family:'Sl Display',Georgia,serif;color-scheme:dark}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 58%,#3a2450,#0b0818 70%);z-index:50;transition:opacity .7s}
.loading.done{opacity:0;pointer-events:none}
.loading .orb{width:44px;height:44px;margin:auto;border-radius:50%;background:radial-gradient(circle at 42% 40%,#fff3c4,#ffb35a 45%,#ff7a1a00 70%);box-shadow:0 0 40px 12px #ffb35a55;animation:breathe 1.8s ease-in-out infinite}
.loading p{margin:18px 0 0;text-align:center;letter-spacing:.32em;font-size:13px;opacity:.75}
.loading .err{color:#ffb4ab;font:14px system-ui,sans-serif;max-width:340px;text-align:center;letter-spacing:0;opacity:1}
@keyframes breathe{50%{transform:scale(1.15);box-shadow:0 0 60px 20px #ffb35a77}}
@media (prefers-reduced-motion:reduce){.loading .orb{animation:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="view" aria-label="Spirelight game view"></canvas>
  <div id="ui"></div>
  <div class="loading" id="loading"><div><div class="orb"></div><p>KINDLING</p><p class="err" id="loadErr"></p></div></div>
</div>

<!-- three.js r128 + add-ons (design.md section 7) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<!-- game modules -->
<script src="js/geom.js"></script>
<script src="levels/levels.js"></script>
<script src="js/blocks.js"></script>
<script src="js/decor.js"></script>
<script src="js/world.js"></script>
<script src="js/hero.js"></script>
<script src="js/engine.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script>
"use strict";
(async function boot() {
  const err = m => { document.getElementById("loadErr").textContent = m; };
  try {
    if (!window.THREE) throw new Error("Could not load the game libraries. Check your connection and reload.");
    if (!window.Game) throw new Error("The game engine failed to load.");
    await Game.init({ canvas: document.getElementById("view"), root: document.getElementById("game"), ui: document.getElementById("ui") });
    try { window.FX && FX.setup && FX.setup(Game); } catch (e) { console.error(e); }
    try { window.UI && UI.setup && UI.setup(Game); } catch (e) { console.error(e); }
    Game.start();   // URL flags: ?level=N starts that level, otherwise the title screen
    document.getElementById("loading").classList.add("done");
  } catch (e) { console.error(e); err(e.message || String(e)); }
})();
</script>
</body>
</html>
