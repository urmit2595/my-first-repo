<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>SPIRELIGHT · Blocks study</title></head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="testbed.js"></script>
<script src="../js/blocks.js"></script>
<script>
(function () {
  "use strict";
  var P = new URLSearchParams(location.search);
  var quality = P.get("quality") || "high";
  var H = +(P.get("height") || 13), C = (P.get("center") || "4,2,4").split(",").map(Number);
  var cells = [], key = {};
  function put(x, y, z, o) { var b = Object.assign({ cell: [x, y, z], style: "sandstone", kind: "cube", walk: true }, o || {}); key[x + "," + y + "," + z] = 1; cells.push(b); }
  function box(a, b, c, d, e, f, o) { for (var x = a; x <= d; x++) for (var y = b; y <= e; y++) for (var z = c; z <= f; z++) put(x, y, z, o); }
  if (P.get("scene") === "level") {
    H = +(P.get("height") || 11); C = (P.get("center") || "3.5,2.5,2").split(",").map(Number);
    box(0, 0, 0, 7, 0, 5, { style: "darkstone", walk: false });
    box(3, 0, 1, 3, 0, 3, { style: "sandstone" }); put(2, 0, 3, { style: "sandstone" }); put(1, 0, 3, { style: "sandstone" });
    box(0, 1, 0, 1, 1, 2, { style: "sandstone" });
    put(2, 1, 1, { style: "sandstone", kind: "stair", up: "-x" });
    box(4, 1, 0, 6, 3, 2, { style: "sandstone" });
    put(4, 4, 0, { style: "slate", walk: false }); put(5, 4, 0, { style: "slate", walk: false });
    box(2, 3, 1, 3, 3, 1, { style: "brass" });
    put(1, 2, 1, { style: "column", walk: false }); put(1, 3, 1, { style: "column", walk: false }); put(1, 4, 1, { style: "column", walk: false });
    put(0, 2, 2, { style: "hedge" }); put(0, 2, 0, { style: "hedge" });
    box(4, 3, 3, 6, 3, 3, { style: "sandstone" }); box(4, 2, 3, 4, 2, 3, { style: "sandstone" }); box(6, 1, 3, 6, 2, 3, { style: "sandstone" });
  } else {
  // foundation, then all eight material styles in a row, a path, stairs, a tower with windows, column, hedge
  box(0, 0, 0, 8, 0, 8, { style: "darkstone", walk: false });
  ["sandstone", "brick", "marble", "darkstone", "brass", "copper", "slate", "wood"].forEach(function (s, i) { put(i, 1, 8, { style: s }); put(i, 1, 7, { style: s, walk: false }); });
  box(0, 1, 4, 3, 1, 4, { style: "sandstone" });
  box(3, 1, 1, 3, 1, 3, { style: "sandstone" });
  put(4, 1, 1, { style: "sandstone", kind: "stair", up: "-x" });
  put(4, 1, 4, { style: "wood" }); put(5, 1, 4, { style: "brass" });
  box(6, 1, 0, 8, 4, 2, { style: "sandstone" });
  box(6, 1, 3, 8, 2, 3, { style: "brick" }); box(7, 3, 3, 8, 3, 3, { style: "marble", walk: false });
  put(0, 1, 1, { style: "column", walk: false }); put(0, 2, 1, { style: "column", walk: false }); put(0, 3, 1, { style: "column", walk: false });
  put(0, 1, 2, { style: "column", walk: false });
  put(1, 1, 1, { style: "hedge" }); put(2, 1, 1, { style: "hedge" }); put(1, 1, 2, { style: "hedge" });
  put(8, 5, 0, { style: "slate", walk: false }); put(7, 5, 1, { style: "copper", walk: false });
  }
  Testbed.start({ height: H, center: C, bg: 0x2a2040, exposure: 1.0 }, function (tb) {
    return Blocks.init(tb.THREE, tb.renderer).then(function () {
      var obj = Blocks.build({ id: "demo", blocks: cells }, { occupied: function (x, y, z) { return !!key[x + "," + y + "," + z]; }, theme: "dusk", quality: quality, seed: 7 });
      tb.scene.add(obj);
      tb.onFrame(function (dt, t) { Blocks.update(dt, t); });
      var n = 0, tris = 0; obj.traverse(function (o) { if (o.isMesh) { n++; tris += o.geometry.index.count / 3; } });
      window.__stats = { draws: n, tris: tris };
    });
  });
})();
</script></body></html>
